<svg width="490" height="500" viewBox="0 0 490 500"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Main terminal window -->
  <rect
    width="490"
    height="500"
    rx="12"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="2"
  />

  <!-- Terminal buttons -->
  <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="22" r="6" fill="#27c93f"/>

  <!-- Header -->
  <text
    x="25"
    y="65"
    fill="#58a6ff"
    font-family="monospace"
    font-size="20"
    font-weight="bold"
  >
    likith1231@github
  </text>

  <text
    x="25"
    y="88"
    fill="#8b949e"
    font-family="monospace"
    font-size="13"
  >
    ─────────────────────────────────────
  </text>


  <!-- ROLE -->
  <g>

    <text
      x="25"
      y="125"
      fill="#00d4aa"
      font-family="monospace"
      font-size="16"
    >
      &gt; ROLE
    </text>

    <text
      x="150"
      y="125"
      fill="#c9d1d9"
      font-family="monospace"
      font-size="16"
    >
      CS Undergrad, B.E.
    </text>

  </g>


  <!-- EDU -->
  <g>

    <text
      x="25"
      y="170"
      fill="#00d4aa"
      font-family="monospace"
      font-size="16"
    >
      &gt; EDU
    </text>

    <text
      x="150"
      y="170"
      fill="#c9d1d9"
      font-family="monospace"
      font-size="16"
    >
      APS College of Engg.
    </text>

  </g>


  <!-- FOCUS -->
  <g>

    <text
      x="25"
      y="215"
      fill="#00d4aa"
      font-family="monospace"
      font-size="16"
    >
      &gt; FOCUS
    </text>

    <text
      x="150"
      y="215"
      fill="#c9d1d9"
      font-family="monospace"
      font-size="16"
    >
      DevOps · Backend · AI
    </text>

  </g>


  <!-- WORKFLOW -->
  <g>

    <text
      x="25"
      y="260"
      fill="#00d4aa"
      font-family="monospace"
      font-size="16"
    >
      &gt; WORKFLOW
    </text>

    <text
      x="150"
      y="260"
      fill="#c9d1d9"
      font-family="monospace"
      font-size="16"
    >
      Multi-agent AI (x3)
    </text>

  </g>


  <!-- TOOLS -->
  <g>

    <text
      x="25"
      y="305"
      fill="#00d4aa"
      font-family="monospace"
      font-size="16"
    >
      &gt; TOOLS
    </text>

    <text
      x="150"
      y="305"
      fill="#c9d1d9"
      font-family="monospace"
      font-size="16"
    >
      K8s / Terraform / RAG
    </text>

  </g>


  <!-- OPEN TO -->
  <g>

    <text
      x="25"
      y="350"
      fill="#00d4aa"
      font-family="monospace"
      font-size="16"
    >
      &gt; OPEN TO
    </text>

    <text
      x="150"
      y="350"
      fill="#c9d1d9"
      font-family="monospace"
      font-size="16"
    >
      DevOps / SDE / AI-ML
    </text>

  </g>


  <!-- STATUS -->
  <g>

    <text
      x="25"
      y="395"
      fill="#00d4aa"
      font-family="monospace"
      font-size="16"
    >
      &gt; STATUS
    </text>

    <text
      x="150"
      y="395"
      fill="#c9d1d9"
      font-family="monospace"
      font-size="16"
    >
      ONLINE
    </text>

    <circle cx="230" cy="390" r="5" fill="#27c93f">
      <animate
        attributeName="opacity"
        values="1;0.3;1"
        dur="2s"
        repeatCount="indefinite"
      />
    </circle>

  </g>


  <!-- Footer prompt -->
  <line x1="0" y1="440" x2="490" y2="440" stroke="#30363d"/>

  <text
    x="25"
    y="470"
    fill="#7d8590"
    font-family="monospace"
    font-size="13"
  >
    $ echo "keep building"
  </text>

  <!-- Blinking cursor -->
  <rect x="246" y="458" width="8" height="14" fill="#c9d1d9">
    <animate
      attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.5;0.51;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
