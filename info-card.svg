<svg width="490" height="500" viewBox="0 0 490 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f18"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2b134"/>
      <stop offset="100%" stop-color="#f2b134" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bdf4ff"/>
      <stop offset="60%" stop-color="#3fd2ef"/>
      <stop offset="100%" stop-color="#3fd2ef" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="490" height="500" rx="10" fill="url(#panelBg)" stroke="#1c2433" stroke-width="2"/>

  <!-- HUD corner brackets -->
  <g stroke="#f2b134" stroke-width="2.5" fill="none">
    <path d="M14,34 V14 H34"/>
    <path d="M456,14 H476 V34"/>
    <path d="M476,466 V486 H456"/>
    <path d="M34,486 H14 V466"/>
  </g>

  <!-- status dot -->
  <circle cx="440" cy="24" r="10" fill="url(#dotGlow)"/>
  <circle cx="440" cy="24" r="3.5" fill="#eafcff"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="30" y="60" fill="#f2b134" font-size="19" font-weight="700" letter-spacing="1">J.A.R.V.I.S.</text>
    <text x="30" y="80" fill="#5c667c" font-size="12" letter-spacing="1">// likith1231@github</text>

    <rect x="30" y="96" width="430" height="2" fill="url(#rule)"/>

    <!-- rows -->
    <g font-size="15">
      <text x="30" y="136" fill="#f2b134">&gt; ROLE</text>
      <text x="155" y="136" fill="#e6e9f2">CS Undergrad, B.E.</text>

      <text x="30" y="176" fill="#f2b134">&gt; EDU</text>
      <text x="155" y="176" fill="#e6e9f2">APS College of Engg.</text>

      <text x="30" y="216" fill="#f2b134">&gt; FOCUS</text>
      <text x="155" y="216" fill="#e6e9f2">DevOps · Backend · AI</text>

      <text x="30" y="256" fill="#f2b134">&gt; WORKFLOW</text>
      <text x="155" y="256" fill="#e6e9f2">Multi-agent AI (x3)</text>

      <text x="30" y="296" fill="#f2b134">&gt; TOOLS</text>
      <text x="155" y="296" fill="#e6e9f2">K8s / Terraform / RAG</text>

      <text x="30" y="336" fill="#f2b134">&gt; OPEN TO</text>
      <text x="155" y="336" fill="#e6e9f2">DevOps / SDE / AI-ML</text>

      <text x="30" y="376" fill="#f2b134">&gt; STATUS</text>
      <text x="155" y="376" fill="#e6e9f2">SUIT ONLINE</text>
      <circle cx="270" cy="371" r="5" fill="#39d353">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <line x1="30" y1="410" x2="460" y2="410" stroke="#1c2433"/>

    <text x="30" y="450" fill="#5c667c" font-size="13">$ initiate_protocol("keep_building")<tspan fill="#3fd2ef">_</tspan></text>
  </g>
</svg>
