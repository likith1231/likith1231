<svg width="490" height="500" viewBox="0 0 490 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081019"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafaf7"/>
      <stop offset="60%" stop-color="#5fd0c9"/>
      <stop offset="100%" stop-color="#5fd0c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="490" height="500" rx="10" fill="url(#panelBg)" stroke="#17222f" stroke-width="2"/>

  <!-- corner ticks -->
  <g stroke="#2a3848" stroke-width="2">
    <path d="M18,18 H34"/>
    <path d="M18,18 V34"/>
    <path d="M472,18 H456"/>
    <path d="M472,18 V34"/>
    <path d="M18,482 H34"/>
    <path d="M18,482 V466"/>
    <path d="M472,482 H456"/>
    <path d="M472,482 V466"/>
  </g>

  <!-- status dot -->
  <circle cx="440" cy="28" r="10" fill="url(#dotGlow)"/>
  <circle cx="440" cy="28" r="3.5" fill="#eafaf7"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="30" y="62" fill="#ffb454" font-size="19" font-weight="700" letter-spacing="1">SIGNAL LOG</text>
    <text x="30" y="82" fill="#5c667c" font-size="12" letter-spacing="1">// likith1231@github · night shift</text>

    <rect x="30" y="98" width="430" height="2" fill="url(#rule)"/>

    <g font-size="15">
      <text x="30" y="138" fill="#ffb454">&gt; ROLE</text>
      <text x="155" y="138" fill="#e6e9f2">CS Undergrad, B.E.</text>

      <text x="30" y="178" fill="#ffb454">&gt; EDU</text>
      <text x="155" y="178" fill="#e6e9f2">APS College of Engg.</text>

      <text x="30" y="218" fill="#ffb454">&gt; FOCUS</text>
      <text x="155" y="218" fill="#e6e9f2">DevOps · Backend · AI</text>

      <text x="30" y="258" fill="#ffb454">&gt; WORKFLOW</text>
      <text x="155" y="258" fill="#e6e9f2">Multi-agent AI (x3)</text>

      <text x="30" y="298" fill="#ffb454">&gt; TOOLS</text>
      <text x="155" y="298" fill="#e6e9f2">K8s / Terraform / RAG</text>

      <text x="30" y="338" fill="#ffb454">&gt; OPEN TO</text>
      <text x="155" y="338" fill="#e6e9f2">DevOps / SDE / AI-ML</text>

      <text x="30" y="378" fill="#ffb454">&gt; STATUS</text>
      <text x="155" y="378" fill="#e6e9f2">LIGHT ON</text>
      <circle cx="255" cy="373" r="5" fill="#5fd0c9">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <line x1="30" y1="412" x2="460" y2="412" stroke="#17222f"/>

    <text x="30" y="452" fill="#5c667c" font-size="13">$ tail -f uptime.log<tspan fill="#5fd0c9">_</tspan></text>
  </g>
</svg>
