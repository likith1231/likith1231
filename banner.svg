<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d16"/>
      <stop offset="55%" stop-color="#070911"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#bdf4ff"/>
      <stop offset="65%" stop-color="#3fd2ef"/>
      <stop offset="100%" stop-color="#0f6f8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5fe3ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5fe3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2b134"/>
      <stop offset="100%" stop-color="#f2b134" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- faint circuit grid -->
  <g stroke="#182234" stroke-width="1">
    <path d="M0 340 H1280" />
    <path d="M0 60 H1280" opacity="0.5"/>
    <path d="M860 0 V400" opacity="0.5"/>
    <path d="M980 0 V400" opacity="0.3"/>
  </g>
  <g stroke="#1c2940" stroke-width="1" opacity="0.6">
    <path d="M900 340 L900 260 L940 220 L1080 220"/>
    <path d="M1000 340 L1000 280 L1040 240 L1220 240"/>
    <path d="M860 130 L920 130 L950 100 L1120 100"/>
    <circle cx="1080" cy="220" r="3" fill="#1c2940" stroke="none"/>
    <circle cx="1220" cy="240" r="3" fill="#1c2940" stroke="none"/>
    <circle cx="1120" cy="100" r="3" fill="#1c2940" stroke="none"/>
  </g>

  <!-- arc reactor emblem, right side -->
  <g transform="translate(1030,200)">
    <circle r="150" fill="url(#reactorGlow)"/>
    <circle r="95" fill="none" stroke="#274257" stroke-width="10"/>
    <circle r="95" fill="none" stroke="#f2b134" stroke-width="2" stroke-dasharray="4 10" opacity="0.7"/>
    <circle r="72" fill="none" stroke="#1d3345" stroke-width="16"/>
    <g stroke="#3fd2ef" stroke-width="4" opacity="0.85">
      <path d="M0,-72 L0,-56"/>
      <path d="M0,72 L0,56"/>
      <path d="M-72,0 L-56,0"/>
      <path d="M72,0 L56,0"/>
      <path d="M-51,-51 L-40,-40"/>
      <path d="M51,-51 L40,-40"/>
      <path d="M-51,51 L-40,40"/>
      <path d="M51,51 L40,40"/>
    </g>
    <circle r="46" fill="#0c1420" stroke="#3a4a5e" stroke-width="3"/>
    <circle r="40" fill="url(#reactorCore)"/>
    <path d="M0,-30 L26,18 L-26,18 Z" fill="#eafcff" opacity="0.9"/>
    <path d="M0,-30 L26,18 L-26,18 Z" fill="none" stroke="#0c1420" stroke-width="2"/>
  </g>

  <!-- headline block -->
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">
    <text x="80" y="108" fill="#f2b134" font-size="15" letter-spacing="4">APS COLLEGE OF ENGINEERING · B.E. CSE</text>

    <text x="78" y="185" fill="#f4f6fb" font-size="66" font-weight="700" font-family="Georgia, 'Times New Roman', serif" letter-spacing="1">Likith Lochan</text>

    <rect x="80" y="205" width="230" height="4" fill="url(#goldRule)"/>

    <text x="80" y="245" fill="#dfe6f2" font-size="21" font-weight="600">DevOps · Backend/Full-Stack · Applied AI</text>

    <text x="80" y="278" fill="#7d8aa3" font-size="15" font-style="italic">No genius, billionaire, playboy, philanthropist — just uptime and pipelines.</text>

    <text x="80" y="330" fill="#4fb8d6" font-size="13" letter-spacing="3">OPEN TO · DEVOPS/CLOUD · BACKEND · SDE · AI-ML</text>
  </g>

  <!-- mark badge -->
  <g transform="translate(80,350)">
    <rect x="0" y="0" width="150" height="28" rx="4" fill="none" stroke="#3a4558"/>
    <text x="12" y="19" fill="#f2b134" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">MARK-I · IN DEV</text>
  </g>

</svg>
