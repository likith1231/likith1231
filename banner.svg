<svg width="1280" height="480" viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060b12"/>
      <stop offset="60%" stop-color="#0a121c"/>
      <stop offset="100%" stop-color="#0d1a22"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a22"/>
      <stop offset="100%" stop-color="#050a0f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6df"/>
      <stop offset="45%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="url(#sky)"/>
  <rect y="258" width="1280" height="222" fill="url(#sea)"/>
  <line x1="0" y1="258" x2="1280" y2="258" stroke="#132030" stroke-width="1"/>

  <!-- stars -->
  <g fill="#eaf6f4">
    <circle cx="70" cy="46" r="1.3" opacity="0.8"/>
    <circle cx="140" cy="90" r="1" opacity="0.5"/>
    <circle cx="230" cy="40" r="1.4" opacity="0.7"/>
    <circle cx="300" cy="110" r="1" opacity="0.45"/>
    <circle cx="380" cy="60" r="1.2" opacity="0.65"/>
    <circle cx="470" cy="34" r="1" opacity="0.5"/>
    <circle cx="540" cy="96" r="1.3" opacity="0.6"/>
    <circle cx="610" cy="52" r="1" opacity="0.45"/>
    <circle cx="30" cy="150" r="1" opacity="0.4"/>
    <circle cx="180" cy="150" r="1" opacity="0.35"/>
    <circle cx="420" cy="150" r="1.1" opacity="0.4"/>
    <circle cx="660" cy="120" r="1.3" opacity="0.55"/>
    <circle cx="720" cy="70" r="1" opacity="0.5"/>
    <circle cx="790" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="850" cy="95" r="1" opacity="0.4"/>
  </g>

  <!-- distant skyline, left -->
  <g fill="#0d1621">
    <rect x="0" y="210" width="26" height="48"/>
    <rect x="30" y="190" width="20" height="68"/>
    <rect x="54" y="224" width="30" height="34"/>
    <rect x="88" y="200" width="18" height="58"/>
    <rect x="110" y="232" width="40" height="26"/>
    <rect x="154" y="214" width="22" height="44"/>
    <rect x="180" y="238" width="34" height="20"/>
    <rect x="218" y="196" width="20" height="62"/>
    <rect x="242" y="222" width="28" height="36"/>
    <rect x="274" y="208" width="18" height="50"/>
    <rect x="296" y="234" width="44" height="24"/>
  </g>
  <g fill="#ffb454" opacity="0.55">
    <rect x="8" y="222" width="3" height="3"/>
    <rect x="38" y="204" width="3" height="3"/>
    <rect x="96" y="214" width="3" height="3"/>
    <rect x="160" y="228" width="3" height="3"/>
    <rect x="226" y="212" width="3" height="3"/>
    <rect x="282" y="222" width="3" height="3"/>
  </g>

  <!-- water reflection strip under lighthouse -->
  <rect x="1000" y="258" width="150" height="130" fill="url(#glowV)" transform="rotate(180 1075 323)" opacity="0.5"/>

  <!-- cliff -->
  <path d="M900,480 L900,300 L960,240 L1020,260 L1060,220 L1120,250 L1180,210 L1280,240 L1280,480 Z" fill="#0c1720"/>

  <!-- sonar ping rings -->
  <g stroke="#5fd0c9" fill="none" stroke-width="1.5">
    <circle cx="1076" cy="150" r="26" opacity="0.5">
      <animate attributeName="r" values="20;42;20" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1076" cy="150" r="34" opacity="0.3">
      <animate attributeName="r" values="30;54;30" dur="4.5s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="4.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- beam -->
  <g transform="translate(1076,150)">
    <path d="M0,0 L-950,-230 L-950,-120 Z" fill="url(#beam)" filter="url(#soft)"/>
  </g>

  <!-- lighthouse tower -->
  <g>
    <path d="M1060,258 L1066,166 L1086,166 L1092,258 Z" fill="#101c28"/>
    <path d="M1063,222 L1089,222 L1088,232 L1064,232 Z" fill="#ffb454" opacity="0.85"/>
    <path d="M1064,190 L1088,190 L1087,198 L1065,198 Z" fill="#1c2b3a"/>
    <rect x="1058" y="258" width="36" height="10" fill="#0c1720"/>

    <!-- lantern room -->
    <rect x="1064" y="146" width="24" height="22" rx="2" fill="#0c1720" stroke="#3a4c5e" stroke-width="1.5"/>
    <circle cx="1076" cy="157" r="17" fill="url(#lampCore)"/>
    <circle cx="1076" cy="157" r="5.5" fill="#fffaf0"/>
    <path d="M1060,146 L1092,146 L1082,134 L1070,134 Z" fill="#101c28"/>
    <path d="M1076,134 L1076,122" stroke="#3a4c5e" stroke-width="2"/>
    <circle cx="1076" cy="119" r="2.5" fill="#5fd0c9"/>
  </g>

  <!-- title block -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="76" y="298" fill="#ffb454" font-size="14" letter-spacing="4">APS COLLEGE OF ENGINEERING · B.E. CSE</text>

    <text x="74" y="360" fill="#f2f6f8" font-size="58" font-weight="700" font-family="Georgia, 'Times New Roman', serif" letter-spacing="0.5">Likith Lochan</text>

    <rect x="76" y="376" width="220" height="3" fill="url(#rule)"/>

    <text x="76" y="408" fill="#cdd7e0" font-size="18" font-weight="600">DevOps · Backend/Full-Stack · Applied AI</text>

    <text x="76" y="436" fill="#8b98ab" font-size="14" font-style="italic">Keeping the lights on when everything else pages me.</text>

    <text x="76" y="462" fill="#5fd0c9" font-size="12" letter-spacing="3">OPEN TO · DEVOPS/CLOUD · BACKEND · SDE · AI-ML</text>
  </g>
</svg>
