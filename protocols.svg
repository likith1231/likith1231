<svg width="900" height="190" viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081019"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
  </defs>
  <rect width="900" height="190" rx="10" fill="url(#pbg)" stroke="#17222f" stroke-width="2"/>

  <g stroke="#2a3848" stroke-width="2">
    <path d="M18,18 H34"/><path d="M18,18 V34"/>
    <path d="M882,18 H866"/><path d="M882,18 V34"/>
    <path d="M18,172 H34"/><path d="M18,172 V156"/>
    <path d="M882,172 H866"/><path d="M882,172 V156"/>
  </g>

  <text x="30" y="38" fill="#5c667c" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">$ cat field-notes.md</text>

  <line x1="300" y1="58" x2="300" y2="160" stroke="#17222f"/>
  <line x1="600" y1="58" x2="600" y2="160" stroke="#17222f"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="30" y="78" fill="#ffb454" font-size="13">01</text>
    <text x="30" y="104" fill="#e6e9f2" font-size="16" font-weight="700">Ship it, then armor it</text>
    <text x="30" y="128" fill="#8792a8" font-size="12">Deploy first; observability</text>
    <text x="30" y="146" fill="#8792a8" font-size="12">and guardrails follow fast.</text>

    <text x="330" y="78" fill="#ffb454" font-size="13">02</text>
    <text x="330" y="104" fill="#e6e9f2" font-size="16" font-weight="700">Automate the boring</text>
    <text x="330" y="128" fill="#8792a8" font-size="12">CI/CD and agents own the</text>
    <text x="330" y="146" fill="#8792a8" font-size="12">routine; I own the judgment.</text>

    <text x="630" y="78" fill="#ffb454" font-size="13">03</text>
    <text x="630" y="104" fill="#e6e9f2" font-size="16" font-weight="700">Verify before trusting it</text>
    <text x="630" y="128" fill="#8792a8" font-size="12">A model proposes the fix; a</text>
    <text x="630" y="146" fill="#8792a8" font-size="12">human or a test confirms it.</text>
  </g>
</svg>
