<svg width="490" height="500" viewBox="0 0 490 500"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Terminal background -->
  <rect width="490" height="500" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Terminal buttons -->
  <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="22" r="6" fill="#27c93f"/>

  <style>
    .ascii { font-family: monospace; font-size: 10px; fill: #c9d1d9; }
    .ascii-green { font-family: monospace; font-size: 10px; fill: #00d4aa; }
    .ascii-dim { font-family: monospace; font-size: 10px; fill: #484f58; }
    .ascii-blue { font-family: monospace; font-size: 10px; fill: #58a6ff; }
    .ascii-cyan { font-family: monospace; font-size: 10px; fill: #39d353; }

    @keyframes fadeRow {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <!-- ASCII Art: Laptop/Developer workstation -->
  <!-- Row 1 -->
  <g opacity="0">
    <text x="20" y="52" class="ascii-dim" xml:space="preserve">                                                    </text>
    <text x="20" y="65" class="ascii-dim" xml:space="preserve">            ╔══════════════════════════╗             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="0.2s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="78" class="ascii-green" xml:space="preserve">            ║  ┌──────────────────────┐║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="0.3s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="91" class="ascii-green" xml:space="preserve">            ║  │ $ whoami             │║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="0.4s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="104" class="ascii" xml:space="preserve">            ║  │ likith1231           │║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="0.5s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="117" class="ascii-green" xml:space="preserve">            ║  │ $ cat skills.yml     │║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="0.6s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="130" class="ascii-blue" xml:space="preserve">            ║  │ devops: ████████░░   │║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="0.7s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="143" class="ascii-blue" xml:space="preserve">            ║  │ llmops: ███████░░░   │║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="0.8s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="156" class="ascii-blue" xml:space="preserve">            ║  │ fullstk: ███████░░░  │║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="0.9s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="169" class="ascii-green" xml:space="preserve">            ║  │ $ kubectl get pods   │║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1.0s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="182" class="ascii-cyan" xml:space="preserve">            ║  │ ✓ all pods running   │║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1.1s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="195" class="ascii-green" xml:space="preserve">            ║  │ $ terraform plan     │║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1.2s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="208" class="ascii-cyan" xml:space="preserve">            ║  │ ✓ 0 to destroy      │║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1.3s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="221" class="ascii-green" xml:space="preserve">            ║  └──────────────────────┘║             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1.4s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="234" class="ascii-dim" xml:space="preserve">            ╚══════════════════════════╝             </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1.5s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="247" class="ascii-dim" xml:space="preserve">           ╱══════════════════════════════╲          </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1.6s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="260" class="ascii-dim" xml:space="preserve">          ╱────────────────────────────────╲         </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1.7s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="273" class="ascii-dim" xml:space="preserve">          ╚══════════════════════════════════╝        </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1.8s" fill="freeze"/>
  </g>

  <!-- Decorative floating code snippets around the laptop -->
  <g opacity="0">
    <text x="20" y="310" class="ascii-dim" xml:space="preserve">     ┌─────────────────┐                             </text>
    <text x="20" y="323" class="ascii-green" xml:space="preserve">     │ docker build .   │    ┌────────────────────┐   </text>
    <text x="20" y="336" class="ascii-cyan" xml:space="preserve">     │ =&gt; CACHED 12/12  │    │ git push origin ↑  │   </text>
    <text x="20" y="349" class="ascii-dim" xml:space="preserve">     └─────────────────┘    │ CI: ✓ all passed   │   </text>
    <text x="20" y="362" class="ascii-dim" xml:space="preserve">                            └────────────────────┘   </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.0s" fill="freeze"/>
  </g>

  <g opacity="0">
    <text x="20" y="388" class="ascii-dim" xml:space="preserve">     ┌──────────────────────────────────────────┐     </text>
    <text x="20" y="401" class="ascii-green" xml:space="preserve">     │ prometheus: scraping 12 targets ✓        │     </text>
    <text x="20" y="414" class="ascii-blue" xml:space="preserve">     │ grafana:    dashboards synced  ✓          │     </text>
    <text x="20" y="427" class="ascii-cyan" xml:space="preserve">     │ jaeger:     traces flowing     ✓          │     </text>
    <text x="20" y="440" class="ascii-dim" xml:space="preserve">     └──────────────────────────────────────────┘     </text>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
  </g>

  <!-- Bottom status line -->
  <line x1="0" y1="460" x2="490" y2="460" stroke="#30363d"/>

  <text x="25" y="482" fill="#7d8590" font-family="monospace" font-size="13"
  >likith@github:~$ <tspan fill="#c9d1d9">_</tspan></text>

  <!-- Blinking cursor -->
  <rect x="210" y="470" width="8" height="14" fill="#00d4aa">
    <animate
      attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.5;0.51;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
