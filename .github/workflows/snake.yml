name: Generate Snake

on:
  # Run every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: likith1231
          # Aurora palette: contribution cells rising from violet through pink to orange,
          # a near-white snake on dark, a deep ink snake on light.
          outputs: |
            dist/github-snake.svg?color_snake=#1e1b2e&color_dots=#ebedf0,#ddd6fe,#a78bfa,#ec4899,#f97316
            dist/github-snake-dark.svg?color_snake=#f5f5fa&color_dots=#161b22,#3b1d72,#7c3aed,#db2777,#fb923c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
