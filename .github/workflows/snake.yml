name: Generate Snake

on:
  # Run every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: likith1231
          # Fresh palette: contribution cells rising from mint through aqua to sunshine,
          # a white snake on dark, a deep ink snake on light.
          outputs: |
            dist/github-snake.svg?color_snake=#1d3340&color_dots=#ebedf0,#b9e8dc,#6fd0bd,#38b0d0,#f2a516
            dist/github-snake-dark.svg?color_snake=#f5f9f8&color_dots=#161b22,#0f4f45,#0f9f86,#1ba3c6,#f2a516
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
