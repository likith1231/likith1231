name: Generate Snake

on:
  # Run every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: likith1231
          # Death Note palette: contribution cells in rising shades of blood red,
          # a bone-white snake on dark, an ink-black snake on light.
          outputs: |
            dist/github-snake.svg?color_snake=#161312&color_dots=#efe8dc,#f2c4bf,#e07a7c,#c0282f,#7a0c12
            dist/github-snake-dark.svg?color_snake=#efe6d8&color_dots=#161b22,#3b0a0d,#6e1016,#a5161f,#ff3b3f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
