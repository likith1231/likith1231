name: Generate Metrics

on:
  # Run every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Uses METRICS_TOKEN if set, otherwise falls back to GITHUB_TOKEN
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          # Output file — committed to repo root
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"

          # User
          user: likith1231

          # Base content
          base: header, activity, community, repositories, metadata

          # Repositories settings
          repositories_forks: no

          # Languages plugin — donut breakdown
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # Config
          config_timezone: Asia/Kolkata
          config_display: large
          config_output: svg
